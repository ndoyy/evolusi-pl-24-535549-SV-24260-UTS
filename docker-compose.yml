# Nilai rahasia (APP_KEY, DB_PASSWORD) dibaca dari file .env di folder ini.
# File .env tidak ikut di-commit; salin dari .env.example lalu isi.

# Pembatasan ukuran log: tiap container menyimpan maksimal 3 berkas @ 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    container_name: uts_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-uts_kepl}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: uts_backend
    command: sh -c "php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Isi APP_KEY di file .env}
      # Log Laravel keluar ke stdout (JSON), terbaca lewat `docker compose logs backend`
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
      # Cache memakai berkas sehingga pemeriksaan /health benar-benar menguji cache,
      # terpisah dari basis data
      CACHE_STORE: file
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-uts_kepl}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
    depends_on:
      db:
        condition: service_healthy
    # Memanggil /health: HTTP 200 -> sehat, 503 atau tidak menjawab -> tidak sehat.
    # (image php:cli tidak punya curl, jadi memakai PHP sendiri)
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: uts_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge